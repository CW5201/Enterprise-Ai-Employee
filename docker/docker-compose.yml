# ---------------------------------------------------------------------------
# Enterprise AI Employee - local full-stack runtime (PLACEHOLDER).
#
# Phase 0 deliberately contains NO deployment logic. The service definitions
# below are kept commented out on purpose so that nobody mistakes this file for
# a working deployment. They are enabled in Phase 7 (see docs/ROADMAP.md).
#
# Planned services:
#   milvus        - vector retrieval
#   neo4j         - knowledge graph
#   (duckdb is an embedded file database - no service needed)
#   api           - FastAPI backend (SSE)
#   frontend      - Vue3 workbench
#
# Usage after Phase 7:
#   docker compose -f docker/docker-compose.yml up -d
# ---------------------------------------------------------------------------

