# ---------------------------------------------------------------------------
# Enterprise AI Employee - CI (Phase 0: skeleton gate only)
#
# Phase 0 runs the static-analysis and test toolchain on an empty skeleton.
# The EVALUATION GATE is intentionally disabled until the evaluation framework
# exists (Phase 5) - no metrics are asserted anywhere.
# ---------------------------------------------------------------------------

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: lint / type-check / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy (type check)
        run: mypy

      - name: Pytest
        run: pytest -m "not slow" --cov=src --cov-report=term-missing

  # --- Evaluation gate ------------------------------------------------------
  # Enabled in Phase 5, once data/eval_dataset.jsonl and the evaluation runner
  # exist. It must compare against a stored baseline instead of asserting
  # hard-coded numbers.
