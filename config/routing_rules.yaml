# ---------------------------------------------------------------------------
# Task-Adaptive Routing — task taxonomy + capability->tool rules (Phase 3).
#
# Consumed by src/core/routing_rules.py (router + baselines).  This file is
# POLICY ONLY: it declares task categories, capability->tool candidate
# rules and the route vocabulary.  Nothing here executes a tool.
#
# Design intent (docs/RESEARCH.md RQ1): routing is driven by task
# *capability requirements*, not by free-text intent labels.  The LLM
# produces a TaskProfile; the rule engine turns capability flags into
# candidate tools; the final RoutingDecision is validated and structured.
# ---------------------------------------------------------------------------

version: v1.0

# Legacy Phase 1 routing policy (still read by src/core/config_loader.py and
# the Phase 1 SupervisorRouterNode fast path).  Phase 3 policy lives in the
# sections below; the two coexist so existing tests keep working.
route:
  default_strategy: clarify
  min_confidence: 0.6
intent:
  - name: knowledge_qa
    description: Look up a fact from enterprise documents.
    tools: [rag]
  - name: text_to_sql
    description: Query structured business data.
    tools: [sql]

# --- Task taxonomy ---------------------------------------------------------
# task_type values (match src/core/routing_types.py::TaskType)
task_types:
  knowledge_lookup:
    description: "Document / policy / procedure / standard question."
    primary_signals: [requires_unstructured_knowledge]
  structured_lookup:
    description: "Exact fact from a business table."
    primary_signals: [requires_structured_data]
  aggregation:
    description: "COUNT / SUM / AVG / GROUP BY over business data."
    primary_signals: [requires_structured_data]
  relationship_query:
    description: "Entity traversal / multi-hop / cross-entity relations."
    primary_signals: [requires_relationship_reasoning]
  statistical_analysis:
    description: "Compute a derived statistic (rate, ratio, distribution)."
    primary_signals: [requires_statistical_analysis]
  trend_analysis:
    description: "Time-series change / growth over periods."
    primary_signals: [requires_statistical_analysis, requires_structured_data]
  comparison:
    description: "Side-by-side / ranking across entities or periods."
    primary_signals: [requires_structured_data, requires_statistical_analysis]
  report_generation:
    description: "Formatted multi-part output aggregating findings."
    primary_signals: [requires_multi_source]
  multi_source_analysis:
    description: "Task that genuinely combines >= 2 knowledge sources."
    primary_signals: [requires_multi_source]
  ambiguous_task:
    description: "Cannot be resolved without clarification."
    primary_signals: []

# --- Capability -> candidate tool rules -----------------------------------
# Each rule: when the TaskProfile flag is true, the tool becomes a
# candidate.  The router aggregates candidates; final selection respects
# route_type and consistency validation (see RoutingDecision).
capability_rules:
  - flag: requires_structured_data
    tool: sql
    weight: 1.0
  - flag: requires_unstructured_knowledge
    tool: rag
    weight: 1.0
  - flag: requires_relationship_reasoning
    tool: kg
    weight: 1.0
  - flag: requires_statistical_analysis
    tool: analysis
    weight: 1.0
  - flag: requires_visualization
    tool: chart
    weight: 0.5        # chart is an optional companion, not a source
  - flag: requires_multi_source
    tool: report
    weight: 0.3        # report aggregates; the real work is the sources

# A task requiring two or more distinct capability sources flags itself
# requires_multi_source=true and routes to multi_tool.
multi_tool_trigger_flags:
  - requires_structured_data
  - requires_unstructured_knowledge
  - requires_relationship_reasoning
  - requires_statistical_analysis

# --- Route vocabulary ------------------------------------------------------
route_types:
  - rag
  - sql
  - kg
  - analysis
  - multi_tool
  - clarification

# --- Clarification policy ---------------------------------------------------
# When ambiguity exceeds this, or a decisive capability flag is missing,
# the router must NOT guess: route to clarification.
clarification:
  max_ambiguity: 0.6
  # If zero capability flags are set, the task is under-specified.
  require_at_least_one_flag: true
  # These task types are inherently clarifiable (user asked vaguely).
  auto_clarify_task_types: [ambiguous_task]

# --- Confidence -------------------------------------------------------------
# confidence = routing-decision confidence (how sure the router is the
# chosen tools/plan fit the task profile), NOT answer correctness.
# A decision whose best-candidate tool has weight >= strong_threshold and
# the profile is low-ambiguity gets high confidence.
confidence:
  strong_single_tool_weight: 1.0   # one clear capability source
  multi_tool_penalty: 0.15         # multi_tool decisions are inherently less certain
  ambiguity_penalty_factor: 0.5    # confidence *= (1 - ambiguity * factor)
