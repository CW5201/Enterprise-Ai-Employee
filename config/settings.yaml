# ---------------------------------------------------------------------------
# Global system settings.
#
# This file controls BEHAVIOUR only. It must never contain business logic and
# must never contain secrets - secrets come from environment variables
# (.env / .env.example) and are referenced here by ${VAR} placeholders.
#
# Loading is implemented in Phase 1 by src/core/config_loader.py.
# ---------------------------------------------------------------------------

app:
  name: enterprise-ai-employee
  env: ${APP_ENV:-local}
  log_level: ${APP_LOG_LEVEL:-INFO}
  language: zh-CN
  timezone: Asia/Shanghai

# --- LLM -------------------------------------------------------------------
# Single primary model family (Qwen). All access goes through
# src/core/llm_client.py; business code must not import a model SDK directly.
llm:
  provider: ${LLM_PROVIDER:-qwen}
  base_url: ${LLM_BASE_URL:-}
  api_key: ${LLM_API_KEY:-}
  model: ${LLM_MODEL:-}
  temperature: 0.2
  top_p: 0.9
  max_tokens: 2048
  timeout_seconds: ${LLM_TIMEOUT_SECONDS:-60}
  max_retries: ${LLM_MAX_RETRIES:-2}
  stream: true

# --- Embedding (BGE-M3) ----------------------------------------------------
embedding:
  model_name: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  device: ${EMBEDDING_DEVICE:-cpu}
  dimension: 1024
  batch_size: 16
  normalize: true
  max_length: 8192

# --- Reranker (BGE-Reranker-v2-M3, Phase 2.3) ----------------------------
# Cross-encoder re-ranking stage: Query -> Dense + BM25 -> RRF ->
# Candidate Top-N (candidate_k) -> BGE-Reranker-v2-M3 -> Final Top-K (final_k).
# The reranker ONLY re-orders the RRF candidate list; it never participates
# in the original dense / BM25 recall.
#
# Phase 2.3 core-implementation default is `enabled: false` so the legacy
# dense / bm25 / hybrid modes are untouched.  Flip to `true` for the formal
# Phase 2.3 experiments.  When enabled and the model cannot load, the
# formal backend RAISES RerankerUnavailableError — it never silently
# falls back to fake / random scores.
reranker:
  enabled: false
  model_path: ${RERANKER_MODEL:-}      # e.g. a local model directory or BAAI/bge-reranker-v2-m3
  device: ${RERANKER_DEVICE:-cpu}
  candidate_k: 20
  final_k: 5
  batch_size: 8

# --- RAG (hybrid retrieval, Phase 2.2) --------------------------------------
# Phase 2.2: Dense (BGE-M3 + Milvus) + BM25 (in-process keyword recall)
# fused with Reciprocal Rank Fusion.  Reranker stays off until Phase 2.3.
rag:
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5
  retrieval_mode: hybrid            # dense | bm25 | hybrid
  rrf_k: 60                        # RRF constant (original paper default)
  bm25:
    k1: 1.5
    b: 0.75

# --- Milvus (vector retrieval ONLY) ---------------------------------------
# Phase 2.1: 本地 Docker Milvus 独立版（localhost:19530，数据目录
# D:\Learningsoftware\milvus\volumes\milvus）；远程 Milvus 需显式设置
# MILVUS_HOST / MILVUS_USER / MILVUS_PASSWORD 才连接。
# collection 名称 / metric_type / index_type 均在此统一管理，代码不写死。
milvus:
  host: ${MILVUS_HOST:-localhost}
  port: ${MILVUS_PORT:-19530}
  user: ${MILVUS_USER:-}
  password: ${MILVUS_PASSWORD:-}
  collection: ${MILVUS_COLLECTION:-enterprise_knowledge}
  metric_type: ${MILVUS_METRIC_TYPE:-IP}
  index_type: ${MILVUS_INDEX_TYPE:-HNSW}
  index_params:
    M: 16
    efConstruction: 200

# --- Knowledge graph (Neo4j, predefined Cypher templates ONLY) -------------
# Phase 2.4.  Credentials live in the environment / .env only; the yaml never
# holds a password.  ``enabled`` defaults to false so that the kg tool stays
# dormant until the graph infrastructure is actually running.
neo4j:
  uri: ${NEO4J_URI:-bolt://localhost:7687}
  username: ${NEO4J_USERNAME:-neo4j}
  password: ${NEO4J_PASSWORD:-}          # resolved from env; never commit
  database: ${NEO4J_DATABASE:-neo4j}
  enabled: false                          # set true when a local Neo4j is up
  max_connection_pool_size: 20
  query_timeout_seconds: 15
  allow_llm_generated_cypher: false      # must stay false - see ADR-004

# --- DuckDB (read-only business database) ---------------------------------
duckdb:
  path: ${DUCKDB_PATH:-data/duckdb/enterprise.duckdb}
  read_only: ${DUCKDB_READ_ONLY:-true}
  max_rows: ${SQL_MAX_ROWS:-1000}
  timeout_seconds: ${SQL_TIMEOUT_SECONDS:-30}
  allow_ddl: false
  allow_dml: false

# --- Analysis (controlled Pandas / NumPy functions only) -------------------
analysis:
  max_rows_scanned: 200000
  allow_arbitrary_python: false       # must stay false

# --- Tools / governance ----------------------------------------------------
tools:
  default_timeout_seconds: 30
  max_retries: 1
  max_parallel_calls: 4
  registry_file: config/tool_registry.yaml

# --- Verification ----------------------------------------------------------
verification:
  enabled: true
  min_support_score: 0.6
  max_retry: 2
  on_failure: retry        # retry | correct | pass_with_warning

# --- Evaluation ------------------------------------------------------------
evaluation:
  dataset_path: ${EVAL_DATASET_PATH:-data/eval_dataset.jsonl}
  output_dir: ${EVAL_OUTPUT_DIR:-outputs/eval}
  dataset_version: v0.0.0            # numbers are filled only after real runs
  default_top_k: 5
  metrics:
    - task_success_rate
    - routing_accuracy
    - retrieval_recall_at_k
    - sql_execution_accuracy
    - evidence_support_rate
    - average_latency_ms
  baselines:
    - llm_only
    - llm_rag
    - hybrid_rag_sql
    - rag_sql_kg
    - ours
  ablations:
    - no_task_adaptive_routing
    - no_knowledge_graph
    - no_claim_evidence_verification
